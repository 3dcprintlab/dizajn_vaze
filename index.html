<title>Generator vaza za 3D print</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Figtree:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--panel:#0e0e0f;--ink:#ececec;--mute:#8d949b;--line:#26292d;--acc:#7fb0ff;--accink:#06101f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 Figtree,system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:1fr clamp(380px,26vw,520px);gap:10px;padding:10px;height:100%}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:40% 1fr}}
.stage{position:relative;min-height:0;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.info{position:absolute;left:12px;bottom:8px;color:var(--mute);font-size:12.5px;pointer-events:none}
h1{position:absolute;left:12px;top:8px;margin:0;font:600 18px/1 Fraunces,Georgia,serif;user-select:none;-webkit-user-select:none;z-index:2;padding:4px 8px 4px 0}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;padding:10px 6px;color:var(--mute);background:none}
.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px var(--acc)}
.pane{display:none;overflow:auto;padding:12px;min-height:0}.pane.on{display:block}
button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 10px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}.sw button{width:32px;height:32px;border-radius:50%;padding:0;border:2px solid var(--line)}.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.sl{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px}
.row label{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}.row b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--acc)}
input[type=text],input[type=email],input[type=number],input[type=password],textarea{width:100%;background:#000;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/3}
.f label,.o label{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.go{width:100%;background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600;padding:9px;margin-top:10px}
.hint{color:var(--mute);font-size:12px;margin:8px 0 0}
.msg{margin-top:8px;color:var(--acc);font-size:13px}
.q{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.q div{display:flex;justify-content:space-between;padding:1px 0}.q .t{font-weight:600;font-size:16px}
h1 img{display:block;height:150px;width:auto;pointer-events:none}
@supports(height:100dvh){html,body{height:100dvh}}
@media(pointer:coarse){input,textarea{font-size:16px!important}}
@media(max-width:820px){input,textarea{font-size:16px!important}.tabs button{padding:13px 6px}}
@media(max-height:500px) and (min-width:600px){.app{grid-template-columns:1fr 360px;gap:6px;padding:6px}h1 img{height:44px}.sl{gap:4px 12px}.pane{padding:8px}.presets{margin-bottom:6px}}
</style>
</head>

 const NW=[];for(let i=0;i<5;i++)NW.push({f:1+Math.floor(rnd()*5),p:rnd()*6.283,g:1+rnd()*5,q:rnd()*6.283,a:.4+rnd()*.6});
 const bn=P.bn,bw=P.bw*Math.PI/Math.max(bn,1);
 pos=new Float32Array(K*S*3);
 for(let k=0;k<K;k++){const {r,y}=rings[k];for(let j=0;j<S;j++){const th=j/S*2*Math.PI,phi=th+tw*y/H;let m=1;
  if(r>0){if(P.sd>=3)m*=Math.cos(Math.PI/P.sd)/Math.cos(((phi%a)+a)%a-Math.PI/P.sd);
   let sup=0,bump=0;if(bn>0&&P.ba>0){const sec=2*Math.PI/bn;let dd=((phi%sec)+sec)%sec;dd=Math.min(dd,sec-dd);if(dd<bw*1.5)sup=(1+Math.cos(Math.PI*dd/(bw*1.5)))/2;if(dd<bw)bump=(1+Math.cos(Math.PI*dd/bw))/2}
   if(P.rib>0&&P.rd>0)m*=1+P.rd*Math.cos(P.rib*phi)*(1-sup);
   if(bump>0)m*=1+P.ba*bump;
   if(P.ni>0){let nv=0,na=0;for(const w of NW){nv+=w.a*Math.cos(w.f*th+w.p+w.g*y/H*2+w.q*Math.sin(w.g*y/H));na+=w.a}m*=1+P.ni*nv/na}}
  const lx=P.lean*Math.pow(y/H,2),o=(k*S+j)*3;pos[o]=r*m*Math.cos(th)+lx;pos[o+1]=y;pos[o+2]=r*m*Math.sin(th)}}
 idx=[];
 for(let k=0;k<K-1;k++)for(let j=0;j<S;j++){const A=k*S+j,B=(k+1)*S+j,C=k*S+(j+1)%S,Dd=(k+1)*S+(j+1)%S;
  if(k>0)idx.push(A,B,C);if(k<K-2)idx.push(B,Dd,C)}
 draw();
}
let vol=0;
function volume(){let v=0;for(let t=0;t<idx.length;t+=3){const a=idx[t]*3,b=idx[t+1]*3,c=idx[t+2]*3;
 v+=pos[a]*(pos[b+1]*pos[c+2]-pos[b+2]*pos[c+1])-pos[a+1]*(pos[b]*pos[c+2]-pos[b+2]*pos[c])+pos[a+2]*(pos[b]*pos[c+1]-pos[b+1]*pos[c])}return Math.abs(v)/6}

const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,1,4000);
sc.add(new THREE.HemisphereLight(0xffffff,0x333333,.9));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(200,300,150);sc.add(dl);
const bed=new THREE.Mesh(new THREE.CircleGeometry(130,64),new THREE.MeshBasicMaterial({color:0x1a1c1f}));bed.rotation.x=-Math.PI/2;bed.position.y=-.2;sc.add(bed);

let az=.7,el=.35,dist=420;
function draw(){
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
 mesh.geometry.dispose();mesh.geometry=g;mat.flatShading=P.sd>=3;mat.needsUpdate=true;
 vol=volume();const w=Math.round(Math.max(P.rb,P.rbel,P.rn,P.rt,P.b2>=10?P.b2:0)*2*(1+P.rd));
 $('info').textContent=`${P.h} × ${w} mm · ~${Math.round(vol/1000*(+$('s-den').value||1.24))} g`;
 quote();render()}
function render(){
 if(!ren)return;
 const W=cv.clientWidth,Hh=cv.clientHeight;if(!W||!Hh)return;if(cv.width!==Math.round(W*devicePixelRatio)||cv.height!==Math.round(Hh*devicePixelRatio)){ren.setPixelRatio(devicePixelRatio);ren.setSize(W,Hh,false)}
 cam.aspect=W/Hh;cam.updateProjectionMatrix();const ty=P.h/2;
 cam.position.set(dist*Math.cos(el)*Math.sin(az),ty+dist*Math.sin(el),dist*Math.cos(el)*Math.cos(az));cam.lookAt(0,ty,0);ren.render(sc,cam)}
const pts=new Map();let drag=null;
const pd=()=>{const a=[...pts.values()];return a.length<2?1:Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY)};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);drag={x:e.clientX,y:e.clientY,d:pd()}});
cv.addEventListener('pointerup',e=>pts.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);
 if(pts.size===2){const d=pd();dist=Math.min(1500,Math.max(120,dist*drag.d/d));drag.d=d}
 else{az-=(e.clientX-drag.x)*.008;el=Math.max(-.2,Math.min(1.45,el+(e.clientY-drag.y)*.008));drag.x=e.clientX;drag.y=e.clientY}render()});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(1500,Math.max(120,dist*(1+e.deltaY*.001)));render()},{passive:false});

function stl(){const n=idx.length/3,b=new ArrayBuffer(84+50*n),v=new DataView(b);let o=84;
 const q=i=>[pos[i*3],-pos[i*3+2],pos[i*3+1]];
 for(let t=0;t<n;t++){const a=q(idx[t*3]),c=q(idx[t*3+1]),d=q(idx[t*3+2]);
  const u=[c[0]-a[0],c[1]-a[1],c[2]-a[2]],w=[d[0]-a[0],d[1]-a[1],d[2]-a[2]];
  let nx=u[1]*w[2]-u[2]*w[1],ny=u[2]*w[0]-u[0]*w[2],nz=u[0]*w[1]-u[1]*w[0];const l=Math.hypot(nx,ny,nz)||1;
  [nx/l,ny/l,nz/l,...a,...c,...d].forEach(f=>{v.setFloat32(o,f,true);o+=4});o+=2}
 v.setUint32(80,n,true);return new Uint8Array(b)}
function crc(u){const T=crc.t||(crc.t=[...Array(256)].map((_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0}));let r=-1;for(let i=0;i<u.length;i++)r=T[(r^u[i])&255]^(r>>>8);return(r^-1)>>>0}
function zip(name,u){const nm=new TextEncoder().encode(name),c=crc(u),s=u.length,L=30+nm.length,b=new Uint8Array(L+s+46+nm.length+22),v=new DataView(b.buffer);
 v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,c,true);v.setUint32(18,s,true);v.setUint32(22,s,true);v.setUint16(26,nm.length,true);b.set(nm,30);b.set(u,L);
 let p=L+s;v.setUint32(p,0x02014b50,true);v.setUint16(p+4,20,true);v.setUint16(p+6,20,true);v.setUint32(p+16,c,true);v.setUint32(p+20,s,true);v.setUint32(p+24,s,true);v.setUint16(p+28,nm.length,true);b.set(nm,p+46);
 p+=46+nm.length;v.setUint32(p,0x06054b50,true);v.setUint16(p+8,1,true);v.setUint16(p+10,1,true);v.setUint32(p+12,46+nm.length,true);v.setUint32(p+16,L+s,true);return b}
