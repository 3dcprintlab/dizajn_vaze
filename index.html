<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generator vaza za 3D print</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Figtree:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--panel:#0e0e0f;--ink:#ececec;--mute:#8d949b;--line:#26292d;--acc:#7fb0ff;--accink:#06101f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 Figtree,system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 410px;gap:10px;padding:10px;height:100%}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:40% 1fr}}
.stage{position:relative;min-height:0;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.info{position:absolute;left:12px;bottom:8px;color:var(--mute);font-size:12.5px;pointer-events:none}
h1{position:absolute;left:12px;top:8px;margin:0;font:600 18px/1 Fraunces,Georgia,serif;user-select:none;-webkit-user-select:none;z-index:2;padding:4px 8px 4px 0}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;padding:10px 6px;color:var(--mute);background:none}
.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px var(--acc)}
.pane{display:none;overflow:auto;padding:12px;min-height:0}.pane.on{display:block}
button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 10px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}.sw button{width:32px;height:32px;border-radius:50%;padding:0;border:2px solid var(--line)}.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.sl{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px}
.row label{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}.row b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--acc)}
input[type=text],input[type=email],input[type=number],input[type=password],textarea{width:100%;background:#000;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/3}
.f label,.o label{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.go{width:100%;background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600;padding:9px;margin-top:10px}
.hint{color:var(--mute);font-size:12px;margin:8px 0 0}
.msg{margin-top:8px;color:var(--acc);font-size:13px}
.q{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.q div{display:flex;justify-content:space-between;padding:1px 0}.q .t{font-weight:600;font-size:16px}
</style>
</head>
<body>
<div class="app">
 <div class="stage"><h1>Generator vaza</h1><canvas id="c"></canvas><div class="info" id="info"></div></div>
 <div class="panel">
  <div class="tabs" id="tabs"></div>
  <div class="pane" id="p-shape">
   <div class="presets" id="presets"></div>
   <div class="sw" id="sw1"></div>
   <div class="sl" id="ctl"></div>
   <p class="hint">Mjere su u mm. Povuci vazu za rotaciju, kotačić ili dva prsta za zoom.</p>
   <button class="go" id="dlo" hidden>Preuzmi STL</button>
  </div>
  <div class="pane" id="p-order">
   <div class="f">
    <div class="w"><label>Ime i prezime</label><input type="text" id="c-ime" autocomplete="name"></div>
    <div><label>Email</label><input type="email" id="c-mail" autocomplete="email"></div>
    <div><label>Telefon</label><input type="text" id="c-tel" autocomplete="tel"></div>
    <div><label>Količina</label><input type="number" id="c-kol" min="1" value="1"></div>
    <div class="w"><label>Boja: <b id="cname"></b></label><div class="sw" id="sw2"></div><input type="hidden" id="c-boja"></div>
    <div class="w"><label>Napomena</label><textarea id="c-nap" rows="2"></textarea></div>
   </div>
   <button class="go" id="send">Pošalji upit za ponudu</button>
   <div class="msg" id="omsg"></div>
   <div id="after" hidden>
    <p class="hint">Ako se e-mail nije otvorio, kopiraj kod i pošalji ga na <span id="oem">adresu vlasnika</span>. U njemu je cijela vaza i tvoji podaci.</p>
    <textarea id="code" rows="3" readonly></textarea>
    <div style="display:flex;gap:6px;margin-top:6px"><button id="cp">Kopiraj kod</button><a id="mail" target="_blank" rel="noopener"><button>Otvori e-mail</button></a></div>
   </div>
  </div>
  <div class="pane" id="p-lock"><label>Lozinka vlasnika</label><input type="password" id="pw" autocomplete="current-password"><button class="go" id="pwok">Otključaj</button><div class="msg" id="pwmsg"></div></div>
  <div class="pane o" id="p-owner">
   <label>Email na koji primaš upite</label>
   <input type="email" id="o-mail" placeholder="ti@primjer.hr">
   <label>Dostupne boje (naziv #hex, jedna po retku)</label>
   <textarea id="o-col" rows="5" placeholder="Bijela #f2f0ea"></textarea>
   <button id="mklink" style="margin:6px 0">Napravi link za kupce</button>
   <textarea id="lnk" rows="3" readonly hidden></textarea>
   <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
   <label>Zalijepi narudžbu (kod iz e-maila)</label>
   <textarea id="imp" rows="2" placeholder="VAZA1:..."></textarea>
   <div style="display:flex;gap:6px;margin:6px 0"><button id="load">Učitaj narudžbu</button><button id="stl">Preuzmi STL</button></div>
   <div class="msg" id="cinfo"></div>
   <div class="f" style="margin-top:8px;display:none">
    <div><label>Filament €/kg</label><input type="number" id="s-fil" value="25"></div>
    <div><label>Gustoća g/cm³</label><input type="number" id="s-den" value="1.24" step=".01"></div>
    <div><label>Brzina ispisa g/h</label><input type="number" id="s-spd" value="15"></div>
    <div><label>Stroj €/h</label><input type="number" id="s-mac" value="1.5" step=".1"></div>
    <div><label>Fiksno €/kom</label><input type="number" id="s-fix" value="2" step=".5"></div>
    <div><label>Marža %</label><input type="number" id="s-mar" value="40"></div>
   </div>
   <div class="q" id="quote" style="display:none"></div>
   <a id="reply" target="_blank" rel="noopener" style="display:none"><button class="go">Odgovori kupcu s ponudom</button></a>
  </div>
 </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let OWNER_EMAIL='';try{const m=location.hash.match(/^#m-([0-9a-f]+)$/);if(m&&m[1].length%2===0){const e=decodeURIComponent(m[1].replace(/../g,'%$&'));if(/\S+@\S+\.\S+/.test(e))OWNER_EMAIL=e}}catch(e){}
const DEFCOL='Bijela #f2f0ea\nCrna #2a2a2c\nSiva #8e949a\nCrvena #b3282d\nPlava #2f5fa8\nZelena #3f7d4e';
const parseCol=t=>t.split('\n').map(l=>l.trim().match(/^(.+?)\s+(#[0-9a-fA-F]{6})$/)).filter(Boolean).map(m=>[m[1],m[2]]);
let COLORS=parseCol(DEFCOL);
if(!/^#(k=|m-)/.test(location.hash))fetch('config.json').then(r=>r.ok?r.json():null).then(c=>{if(!c)return;if(c.email&&/\S+@\S+\.\S+/.test(c.email))OWNER_EMAIL=c.email;const cl=Array.isArray(c.boje)?parseCol(c.boje.join('\n')).slice(0,16):[];if(cl.length){COLORS=cl;colIdx=0;pickCol(0)}try{if(!localStorage.getItem('oc'))$('o-col').value=COLORS.map(x=>x[0]+' '+x[1]).join('\n');if(!localStorage.getItem('om')&&OWNER_EMAIL)$('o-mail').value=OWNER_EMAIL}catch(x){}}).catch(()=>{});
try{const m=location.hash.match(/^#k=([\w-]+)$/);if(m){const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(/\S+@\S+\.\S+/.test(o.e))OWNER_EMAIL=o.e;if(Array.isArray(o.c)&&o.c.length)COLORS=o.c.filter(x=>x&&/^#[0-9a-fA-F]{6}$/.test(x[1])).slice(0,16)}}catch(e){}

const D=[['h','Visina',60,240,1],['rb','Polumjer dna',10,80,1],['rbel','Polumjer trbuha',10,100,1],['bp','Visina trbuha',0.15,0.75,0.01],['bt','Debljina trbuha',0,0.4,0.01],['rw','Polumjer struka',6,80,1],['b2','Drugi trbuh (polumjer)',0,100,1],['b2p','Visina drugog trbuha',0.4,0.9,0.01],['b2t','Debljina drugog trbuha',0,0.4,0.01],['rn','Polumjer vrata',6,80,1],['rt','Polumjer otvora',6,90,1],['rib','Broj rebara',0,24,1],['rd','Dubina rebara',0,0.25,0.01],['bn','Velika rebra (broj)',0,8,1],['ba','Visina velikog rebra',0,0.5,0.01],['bw','Širina velikog rebra',0.1,0.8,0.01],['tw','Uvijanje (°)',-540,540,5],['sd','Stranice (0 = okrugla)',0,12,1],['ni','Nepravilnost',0,0.3,0.01],['ns','Nepravilnost (varijanta)',1,99,1],['lean','Nagib',0,40,1],['wall','Debljina zida',0.4,6,0.2],['fl','Debljina dna',0.4,8,0.2]];
const PR={'Klasična':{h:170,rb:34,rbel:58,bp:.4,rn:24,rt:34,rib:0,rd:0,tw:0,sd:0,wall:2,fl:3},
'Tikvica':{h:140,rb:30,rbel:62,bp:.3,rn:16,rt:20,rib:0,rd:0,tw:0,sd:0,wall:2,fl:3},
'Rebrasti valjak':{h:180,rb:38,rbel:42,bp:.5,rn:38,rt:40,rib:14,rd:.08,tw:0,sd:0,wall:2,fl:3},
'Uvijena':{h:200,rb:34,rbel:44,bp:.45,rn:34,rt:40,rib:0,rd:0,tw:360,sd:5,wall:2,fl:3},
'Poligon':{h:150,rb:30,rbel:50,bp:.35,rn:36,rt:46,rib:0,rd:0,tw:0,sd:6,wall:2,fl:3},
'Zvono':{h:130,rb:22,rbel:30,bp:.3,rn:44,rt:62,rib:8,rd:.06,tw:90,sd:0,wall:2,fl:3},
'Velika rebra':{h:180,rb:36,rbel:48,bp:.45,rn:34,rt:40,rib:20,rd:.05,tw:0,sd:0,wall:2,fl:3,bn:4,ba:.22,bw:.35},
'Nepravilna':{h:190,rb:34,rbel:56,bp:.4,rn:26,rt:38,rib:0,rd:0,tw:0,sd:0,wall:2,fl:3,ni:.14,ns:23,lean:14},
'Dva trbuha':{h:200,rb:30,rbel:52,bp:.28,rn:22,rt:32,rib:0,rd:0,tw:0,sd:0,wall:2,fl:3,b2:42,b2p:.66,rw:24}};
const P={};const S=240,N=24;
const cr=(a,b,c,d,t)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
let rings,pos,idx;
function build(){
 const H=P.h,two=P.b2>=10;
 const belly=(r,y,lo,hi,th)=>{const a=Math.max(y-th*H/2,lo),b=Math.min(y+th*H/2,hi);return b-a>1?[[r,a],[r,b]]:[[r,y]]};
 let pts=[[P.rb,0],...belly(P.rbel,H*P.bp,H*.06,H*.80,P.bt),[P.rn,H*.85],[P.rt,H]];
 if(two){const yb=Math.min(Math.max(P.b2p,P.bp+.12),.9),mid=H*(P.bp+yb)/2,ny=H*Math.min(.96,yb+.07);pts=[[P.rb,0],...belly(P.rbel,H*P.bp,H*.06,mid-H*.04,P.bt),[P.rw,mid],...belly(P.b2,H*yb,mid+H*.04,ny-H*.04,P.b2t),[P.rn,ny],[P.rt,H]]}
 const R=pts.map(p=>p[0]),Y=pts.map(p=>p[1]);
 const n=R.length,prof=[];
 for(let s=0;s<n-1;s++)for(let t=0;t<N;t++)prof.push({r:Math.max(2,cr(R[Math.max(s-1,0)],R[s],R[s+1],R[Math.min(s+2,n-1)],t/N)),y:Y[s]+(Y[s+1]-Y[s])*t/N});
 prof.push({r:R[n-1],y:H});
 const rAt=y=>{for(let i=1;i<prof.length;i++)if(prof[i].y>=y){const a=prof[i-1],b=prof[i],u=(y-a.y)/((b.y-a.y)||1);return a.r+(b.r-a.r)*u}return R[n-1]};
 rings=[{r:0,y:0},...prof];
 for(let i=prof.length-1;i>=0;i--)if(prof[i].y>P.fl)rings.push({r:Math.max(prof[i].r-P.wall,.8),y:prof[i].y});
 rings.push({r:Math.max(rAt(P.fl)-P.wall,.8),y:P.fl},{r:0,y:P.fl});
 const K=rings.length,tw=P.tw*Math.PI/180,a=2*Math.PI/P.sd;
 const rnd=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(P.ns*7919+13);
 const NW=[];for(let i=0;i<5;i++)NW.push({f:1+Math.floor(rnd()*5),p:rnd()*6.283,g:1+rnd()*5,q:rnd()*6.283,a:.4+rnd()*.6});
 const bn=P.bn,bw=P.bw*Math.PI/Math.max(bn,1);
 pos=new Float32Array(K*S*3);
 for(let k=0;k<K;k++){const {r,y}=rings[k];for(let j=0;j<S;j++){const th=j/S*2*Math.PI,phi=th+tw*y/H;let m=1;
  if(r>0){if(P.sd>=3)m*=Math.cos(Math.PI/P.sd)/Math.cos(((phi%a)+a)%a-Math.PI/P.sd);
   let sup=0,bump=0;if(bn>0&&P.ba>0){const sec=2*Math.PI/bn;let dd=((phi%sec)+sec)%sec;dd=Math.min(dd,sec-dd);if(dd<bw*1.5)sup=(1+Math.cos(Math.PI*dd/(bw*1.5)))/2;if(dd<bw)bump=(1+Math.cos(Math.PI*dd/bw))/2}
   if(P.rib>0&&P.rd>0)m*=1+P.rd*Math.cos(P.rib*phi)*(1-sup);
   if(bump>0)m*=1+P.ba*bump;
   if(P.ni>0){let nv=0,na=0;for(const w of NW){nv+=w.a*Math.cos(w.f*th+w.p+w.g*y/H*2+w.q*Math.sin(w.g*y/H));na+=w.a}m*=1+P.ni*nv/na}}
  const lx=P.lean*Math.pow(y/H,2),o=(k*S+j)*3;pos[o]=r*m*Math.cos(th)+lx;pos[o+1]=y;pos[o+2]=r*m*Math.sin(th)}}
 idx=[];
 for(let k=0;k<K-1;k++)for(let j=0;j<S;j++){const A=k*S+j,B=(k+1)*S+j,C=k*S+(j+1)%S,Dd=(k+1)*S+(j+1)%S;
  if(k>0)idx.push(A,B,C);if(k<K-2)idx.push(B,Dd,C)}
 draw();
}
let vol=0;
function volume(){let v=0;for(let t=0;t<idx.length;t+=3){const a=idx[t]*3,b=idx[t+1]*3,c=idx[t+2]*3;
 v+=pos[a]*(pos[b+1]*pos[c+2]-pos[b+2]*pos[c+1])-pos[a+1]*(pos[b]*pos[c+2]-pos[b+2]*pos[c])+pos[a+2]*(pos[b]*pos[c+1]-pos[b+1]*pos[c])}return Math.abs(v)/6}
const $=id=>document.getElementById(id);
const cv=$('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,1,4000);
sc.add(new THREE.HemisphereLight(0xffffff,0x333333,.9));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(200,300,150);sc.add(dl);
const bed=new THREE.Mesh(new THREE.CircleGeometry(130,64),new THREE.MeshBasicMaterial({color:0x1a1c1f}));bed.rotation.x=-Math.PI/2;bed.position.y=-.2;sc.add(bed);
const mat=new THREE.MeshStandardMaterial({color:0xe9e6df,roughness:.55,metalness:0,side:THREE.DoubleSide});
const mesh=new THREE.Mesh(new THREE.BufferGeometry(),mat);sc.add(mesh);
let az=.7,el=.35,dist=420;
function draw(){
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
 mesh.geometry.dispose();mesh.geometry=g;mat.flatShading=P.sd>=3;mat.needsUpdate=true;
 vol=volume();const w=Math.round(Math.max(P.rb,P.rbel,P.rn,P.rt,P.b2>=10?P.b2:0)*2*(1+P.rd));
 $('info').textContent=`${P.h} × ${w} mm · ~${Math.round(vol/1000*(+$('s-den').value||1.24))} g`;
 quote();render()}
function render(){
 const W=cv.clientWidth,Hh=cv.clientHeight;if(!W||!Hh)return;if(cv.width!==Math.round(W*devicePixelRatio)||cv.height!==Math.round(Hh*devicePixelRatio)){ren.setPixelRatio(devicePixelRatio);ren.setSize(W,Hh,false)}
 cam.aspect=W/Hh;cam.updateProjectionMatrix();const ty=P.h/2;
 cam.position.set(dist*Math.cos(el)*Math.sin(az),ty+dist*Math.sin(el),dist*Math.cos(el)*Math.cos(az));cam.lookAt(0,ty,0);ren.render(sc,cam)}
const pts=new Map();let drag=null;
const pd=()=>{const a=[...pts.values()];return a.length<2?1:Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY)};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);drag={x:e.clientX,y:e.clientY,d:pd()}});
cv.addEventListener('pointerup',e=>pts.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);
 if(pts.size===2){const d=pd();dist=Math.min(1500,Math.max(120,dist*drag.d/d));drag.d=d}
 else{az-=(e.clientX-drag.x)*.008;el=Math.max(-.2,Math.min(1.45,el+(e.clientY-drag.y)*.008));drag.x=e.clientX;drag.y=e.clientY}render()});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(1500,Math.max(120,dist*(1+e.deltaY*.001)));render()},{passive:false});
addEventListener('resize',render);
// kontrole
const ctl=$('ctl'),ins={},vals={};
D.forEach(([k,l,mn,mx,st])=>{const r=document.createElement('div');r.className='row';
 r.innerHTML=`<label><span>${l}</span><b></b></label><input type="range" min="${mn}" max="${mx}" step="${st}">`;
 const i=r.querySelector('input'),b=r.querySelector('b');ins[k]=i;vals[k]=b;
 i.oninput=()=>{P[k]=+i.value;b.textContent=P[k];build()};ctl.appendChild(r)});
const DEF={bn:0,ba:.2,bw:.5,ni:0,ns:7,lean:0,b2:0,b2p:.7,rw:24,bt:0,b2t:0};
function set(o){Object.assign(P,DEF,o);D.forEach(([k])=>{ins[k].value=P[k];vals[k].textContent=P[k]});build()}
Object.entries(PR).forEach(([n,o])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>set(o);$('presets').appendChild(b)});
const rb=document.createElement('button');rb.textContent='Nasumična';
rb.onclick=()=>{const o={};D.forEach(([k,,mn,mx,st])=>{o[k]=Math.round((mn+Math.random()*(mx-mn))/st)*st});
 o.h=100+Math.round(Math.random()*140);o.wall=2;o.fl=3;o.rn=Math.min(o.rn,o.rbel);o.rib=Math.random()<.5?0:o.rib;o.sd=Math.random()<.6?0:Math.max(3,o.sd);o.rd=Math.min(o.rd,.14);o.tw=Math.random()<.5?0:o.tw;o.bn=Math.random()<.5?0:Math.round(2+Math.random()*4);o.ba=Math.min(o.ba,.3);o.ni=Math.random()<.5?0:+(Math.random()*.12).toFixed(2);o.lean=Math.random()<.5?0:Math.round(Math.random()*15);o.b2=Math.random()<.6?0:Math.round(25+Math.random()*45);
 Object.keys(o).forEach(k=>o[k]=+(+o[k]).toFixed(2));set(o)};$('presets').appendChild(rb);
// STL
function stl(){const n=idx.length/3,b=new ArrayBuffer(84+50*n),v=new DataView(b);let o=84;
 const q=i=>[pos[i*3],-pos[i*3+2],pos[i*3+1]];
 for(let t=0;t<n;t++){const a=q(idx[t*3]),c=q(idx[t*3+1]),d=q(idx[t*3+2]);
  const u=[c[0]-a[0],c[1]-a[1],c[2]-a[2]],w=[d[0]-a[0],d[1]-a[1],d[2]-a[2]];
  let nx=u[1]*w[2]-u[2]*w[1],ny=u[2]*w[0]-u[0]*w[2],nz=u[0]*w[1]-u[1]*w[0];const l=Math.hypot(nx,ny,nz)||1;
  [nx/l,ny/l,nz/l,...a,...c,...d].forEach(f=>{v.setFloat32(o,f,true);o+=4});o+=2}
 v.setUint32(80,n,true);return new Uint8Array(b)}
function crc(u){const T=crc.t||(crc.t=[...Array(256)].map((_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0}));let r=-1;for(let i=0;i<u.length;i++)r=T[(r^u[i])&255]^(r>>>8);return(r^-1)>>>0}
function zip(name,u){const nm=new TextEncoder().encode(name),c=crc(u),s=u.length,L=30+nm.length,b=new Uint8Array(L+s+46+nm.length+22),v=new DataView(b.buffer);
 v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,c,true);v.setUint32(18,s,true);v.setUint32(22,s,true);v.setUint16(26,nm.length,true);b.set(nm,30);b.set(u,L);
 let p=L+s;v.setUint32(p,0x02014b50,true);v.setUint16(p+4,20,true);v.setUint16(p+6,20,true);v.setUint32(p+16,c,true);v.setUint32(p+20,s,true);v.setUint32(p+24,s,true);v.setUint16(p+28,nm.length,true);b.set(nm,p+46);
 p+=46+nm.length;v.setUint32(p,0x06054b50,true);v.setUint16(p+8,1,true);v.setUint16(p+10,1,true);v.setUint32(p+12,46+nm.length,true);v.setUint32(p+16,L+s,true);return b}

 try{if(dls)await dls.save({filename:name+'.zip',data:zip(name+'.stl',stl())});

async function sha(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vaze:'+s));return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}

const b64u=t=>btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=t=>decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/'))));

const dec=s=>{s=s.trim();if(/^V2/.test(s)){const a=JSON.parse(ub64(s.slice(2))),p={};D.forEach(([k],i)=>{if(a[0][i]!==undefined)p[k]=a[0][i]});return{p,c:{ime:a[1],mail:a[2],tel:a[3],kol:a[4],boja:a[5],nap:a[6]}}}return JSON.parse(decodeURIComponent(escape(atob(s.replace(/^VAZA1:/,'')))))};

 if(!c.ime||!/\S+@\S+\.\S+/.test(c.mail)){$('omsg').textContent='Upiši ime i ispravan email.';return}

 const body=`Upit za ponudu: vaza\n\nIme: ${c.ime}\nEmail: ${c.mail}\nTelefon: ${c.tel}\nKoličina: ${c.kol}\nBoja/materijal: ${c.boja}\nNapomena: ${c.nap}\n\nMjere: ${$('info').textContent}\n${D.map(([k])=>lab[k]+': '+P[k]).join('\n')}\n\nOtvori narudžbu jednim klikom:\n${location.href.split('#')[0]}#narudzba=${encodeURIComponent(code)}\n\nKod narudžbe (ako link ne radi):\n${code}\n`;
